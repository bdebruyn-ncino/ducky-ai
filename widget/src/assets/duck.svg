<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 92" width="76" height="88">
  <!-- By itself this file shows the idle duck. In the widget, CSS shows the eyes and props for each state. -->
  <style>
    .duck-eye, .duck-prop, .duck-ripples { display: none; }
    .duck-eye-open { display: inline; }
  </style>

  <!-- The drawing is in its own coordinates; this shifts it to leave room for the props above and around. -->
  <g transform="translate(8 22)">
    <g class="duck-ripples" fill="none" stroke="#f2f2f2" stroke-width="1.2">
      <ellipse class="duck-ripple-1" cx="29" cy="57" rx="26" ry="3.6" />
      <ellipse class="duck-ripple-2" cx="29" cy="57" rx="31" ry="4.6" />
    </g>
    <ellipse cx="31" cy="57" rx="19" ry="2.5" fill="#000000" fill-opacity="0.28" />

    <g class="duck-figure">
      <ellipse cx="9" cy="36" rx="6" ry="4.5" transform="rotate(-35 9 36)" fill="#ffd23f" />
      <ellipse cx="29" cy="42" rx="22" ry="15" fill="#ffd23f" />
      <circle cx="40" cy="22" r="13" fill="#ffd23f" />
      <rect x="49" y="20" width="14" height="8" rx="4" fill="#ff8a00" />
      <ellipse cx="26" cy="44" rx="11" ry="6.5" transform="rotate(8 26 44)" fill="#ffbb1c" />

      <g class="duck-eyes" fill="#1b1b1f">
        <g class="duck-eye duck-eye-open"><circle cx="43.5" cy="19" r="2.3" /></g>
        <g class="duck-eye duck-eye-wide"><circle cx="43.5" cy="19" r="2.9" /></g>
        <g class="duck-eye duck-eye-look"><circle cx="44.5" cy="17.5" r="2.3" /></g>
        <g class="duck-eye duck-eye-happy">
          <path d="M40.78 19.73 A3 3 0 0 1 46.22 19.73" fill="none" stroke="#1b1b1f" stroke-width="1.9" stroke-linecap="round" />
          <circle cx="47.5" cy="26" r="2.6" fill="#ff8aa1" fill-opacity="0.55" />
        </g>
        <g class="duck-eye duck-eye-worried">
          <circle cx="43.5" cy="19.5" r="2.6" />
          <path d="M39.5 13.2 L46.5 15.8" fill="none" stroke="#1b1b1f" stroke-width="1.8" stroke-linecap="round" />
        </g>
        <g class="duck-eye duck-eye-dead">
          <path d="M41.3 16.8 L45.7 21.2 M45.7 16.8 L41.3 21.2" fill="none" stroke="#1b1b1f" stroke-width="1.9" stroke-linecap="round" />
        </g>
        <g class="duck-eye duck-eye-flat">
          <path d="M41 19.5 L46 19.5" fill="none" stroke="#1b1b1f" stroke-width="1.9" stroke-linecap="round" />
        </g>
      </g>
    </g>

    <!-- Dictation off: knocked out, with a halo and its tongue out. -->
    <g class="duck-prop duck-prop-dead">
      <rect x="53" y="28" width="5" height="5" rx="2.4" fill="#ff8aa1" />
      <ellipse class="duck-halo" cx="40" cy="3" rx="8.5" ry="2.6" fill="none" stroke="#ffd23f" stroke-width="1.8" />
    </g>

    <!-- Listening: sound waves behind the head. -->
    <g class="duck-prop duck-prop-sound" fill="none" stroke="#ffd23f" stroke-width="2.2" stroke-linecap="round">
      <path class="duck-sound-1" d="M23.55 31.5 A19 19 0 0 1 23.55 12.5" />
      <path class="duck-sound-2" d="M17.34 32.57 A25 25 0 0 1 17.34 11.43" />
      <path class="duck-sound-3" d="M10.87 32.6 A31 31 0 0 1 10.87 11.4" />
    </g>

    <!-- Working: thought bubbles rising. -->
    <g class="duck-prop duck-prop-thought" fill="#f2f2f2">
      <circle class="duck-thought-1" cx="56" cy="8" r="1.7" />
      <circle class="duck-thought-2" cx="61" cy="1" r="2.3" />
      <circle class="duck-thought-3" cx="67" cy="-8" r="3.3" />
    </g>

    <!-- Waiting for the user: a question mark. -->
    <g class="duck-prop duck-prop-question">
      <g class="duck-question">
        <path d="M34.83 -10.88 A5.5 5.5 0 1 1 44.21 -5.46 L40 0.2 L40 4" fill="none" stroke="#f2f2f2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="40" cy="9.5" r="1.5" fill="#f2f2f2" />
      </g>
    </g>

    <!-- Done: sparkles. -->
    <g class="duck-prop duck-prop-sparkles" fill="#fff7c2">
      <polygon class="duck-sparkle-1" points="58,-3 59.4,0.6 63,2 59.4,3.4 58,7 56.6,3.4 53,2 56.6,0.6" />
      <polygon class="duck-sparkle-2" points="67,-12.6 68,-10 70.6,-9 68,-8 67,-5.4 66,-8 63.4,-9 66,-10" />
      <polygon class="duck-sparkle-3" points="18,0.8 18.9,3.1 21.2,4 18.9,4.9 18,7.2 17.1,4.9 14.8,4 17.1,3.1" />
    </g>

    <!-- Error: a sweat drop. -->
    <g class="duck-prop duck-prop-sweat" fill="#8fd3ff">
      <g class="duck-sweat">
        <circle cx="55" cy="14" r="2.3" />
        <polygon points="52.8,13.4 57.2,13.4 55,7.5" />
      </g>
    </g>
  </g>
</svg>
