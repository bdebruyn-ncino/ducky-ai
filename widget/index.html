<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ducky</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="widget">
      <ol id="messages" class="messages" aria-live="polite"></ol>

      <div id="working" class="working" hidden>
        <span id="working-text">Ducky is working...</span>
        <button id="cancel" type="button">Cancel</button>
      </div>

      <form id="ask-form" class="ask-form">
        <input id="question" placeholder="Ask Ducky..." autocomplete="off" autofocus />
        <button id="mic" type="button" title="Talk to Ducky" aria-label="Talk to Ducky">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0" />
            <path d="M12 18v3" />
          </svg>
        </button>
        <button id="ask" type="submit">Ask</button>
      </form>
    </main>
  </body>
</html>
