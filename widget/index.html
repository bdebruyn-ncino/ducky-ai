<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/duck.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ducky</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main id="widget" class="widget" data-view="empty">
      <header class="stage">
        <button id="duck" type="button" class="duck" title="Talk to Ducky" aria-label="Talk to Ducky">
          <span class="duck-art"></span>
        </button>
        <div class="stage-text">
          <p id="working-text" class="status" aria-live="polite">Click me and ask away</p>
          <p id="status-hint" class="hint"></p>
          <button id="cancel" type="button" class="ghost" hidden>Cancel</button>
        </div>
      </header>

      <ol id="messages" class="messages"></ol>

      <form id="ask-form" class="ask-form" hidden>
        <input id="question" placeholder="Ask Ducky..." autocomplete="off" />
        <button id="ask" type="submit" class="send" aria-label="Send" title="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 19V5" />
            <path d="M5 12l7-7 7 7" />
          </svg>
        </button>
      </form>

      <footer class="footer">
        <button id="type-toggle" type="button" class="link-button">Type instead</button>
        <span class="footer-spacer"></span>
        <button id="new-session" type="button" class="link-button">New conversation</button>
        <button id="mode-toggle" type="button" class="link-button">Text only</button>
      </footer>
    </main>
  </body>
</html>
