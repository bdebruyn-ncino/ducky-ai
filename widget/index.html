<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ducky</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="widget">
      <ol id="messages" class="messages" aria-live="polite"></ol>

      <div id="working" class="working" hidden>
        <span id="working-text">Ducky is working...</span>
        <button id="cancel" type="button">Cancel</button>
      </div>

      <form id="ask-form" class="ask-form">
        <button id="duck" type="button" class="duck" title="Talk to Ducky" aria-label="Talk to Ducky">
          <span class="duck-art"></span>
        </button>
        <input id="question" placeholder="Ask Ducky..." autocomplete="off" autofocus />
        <button id="ask" type="submit">Ask</button>
      </form>

      <button id="mode-toggle" type="button" class="link-button">Text only</button>
    </main>
  </body>
</html>
